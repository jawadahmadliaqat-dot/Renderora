<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Renderora | Cloud Animation Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    #editor-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #1e1e1e;
    }
    #monaco-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2.5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2">
      <button id="menu-btn" class="p-2 rounded-lg bg-slate-800 active:bg-slate-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-xs">⚡</div>
        <span class="font-bold text-sm">Renderora</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <select id="template-select" class="bg-slate-800 text-xs px-2 py-1.5 rounded-lg border border-slate-700 max-w-[110px]">
        <option value="">Examples</option>
        <option value="circle">Circle</option>
        <option value="square">Square→Circle</option>
        <option value="math">Euler</option>
        <option value="walking">Stickman</option>
        <option value="matplotlib">Sine Wave</option>
        <option value="heart">Heart</option>
      </select>
      <div id="auth-area">
        <button id="login-btn" class="bg-white text-gray-900 text-xs font-semibold px-3 py-1.5 rounded-lg">Sign in</button>
      </div>
    </div>
  </header>

  <!-- DRAWER -->
  <div id="drawer-bg" class="fixed inset-0 bg-black/60 z-40 hidden"></div>
  <div id="drawer" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-900 border-r border-slate-800 z-50 -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center">
      <span class="font-bold">Menu</span>
      <button id="close-drawer" class="text-slate-400 text-2xl leading-none">×</button>
    </div>
    <div class="p-4 border-b border-slate-800">
      <div class="flex justify-between text-xs mb-1.5">
        <span class="text-slate-400">Today's Renders</span>
        <span id="quota-text" class="text-indigo-400 font-medium">0 / 5</span>
      </div>
      <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
        <div id="quota-bar" class="bg-indigo-500 h-full transition-all" style="width:0%"></div>
      </div>
    </div>
    <div class="flex-1 p-3 space-y-1 text-sm">
      <button onclick="showSection('editor')" class="w-full text-left px-3 py-3 rounded-xl hover:bg-slate-800">💻 Playground</button>
      <button onclick="showSection('history')" class="w-full text-left px-3 py-3 rounded-xl hover:bg-slate-800">🕒 History</button>
      <button onclick="showSection('library')" class="w-full text-left px-3 py-3 rounded-xl hover:bg-slate-800">📚 Library</button>
      <button onclick="openPricing()" class="w-full text-left px-3 py-3 rounded-xl hover:bg-slate-800 text-indigo-400">⭐ Upgrade Pro</button>
    </div>
    <div id="user-info" class="p-4 border-t border-slate-800 hidden">
      <div class="flex items-center gap-3 mb-3">
        <img id="user-pic" class="w-10 h-10 rounded-full border border-slate-700">
        <div class="min-w-0">
          <p id="user-name" class="text-sm font-medium truncate"></p>
          <p id="user-email" class="text-xs text-slate-500 truncate"></p>
        </div>
      </div>
      <button id="signout-btn" class="w-full text-sm bg-slate-800 hover:bg-red-900/40 border border-slate-700 py-2.5 rounded-xl">Sign out</button>
    </div>
  </div>

  <!-- Pricing Modal -->
  <div id="pricing-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 relative">
      <button onclick="closePricing()" class="absolute top-3 right-3 text-slate-400 text-xl">×</button>
      <div class="text-center mb-5">
        <div class="text-3xl mb-2">⭐</div>
        <h3 class="text-xl font-bold">Renderora Pro</h3>
        <p class="text-indigo-400 font-bold text-2xl mt-1">$5<span class="text-sm text-slate-400 font-normal">/mo</span></p>
      </div>
      <ul class="text-sm text-slate-300 space-y-2.5 mb-6">
        <li>✅ 20 Manim renders / day</li>
        <li>✅ HD Quality</li>
        <li>✅ Priority queue</li>
        <li>✅ Unlimited history</li>
      </ul>
      <button onclick="upgradePro()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-semibold">Upgrade Now</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="flex border-b border-slate-800 bg-slate-900 shrink-0">
    <button id="tab-editor" class="flex-1 py-3 text-sm font-medium text-indigo-400 border-b-2 border-indigo-500">Editor</button>
    <button id="tab-preview" class="flex-1 py-3 text-sm font-medium text-slate-400 border-b-2 border-transparent">Preview</button>
  </div>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- EDITOR -->
    <div id="editor-panel" class="flex flex-col flex-1 overflow-hidden">
      <div class="bg-slate-950 px-3 py-2 border-b border-slate-800 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-400 mono">scene.py</span>
          <div class="flex bg-slate-800 rounded-lg p-0.5">
            <button id="q-low" class="px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-600 text-white">Low</button>
            <button id="q-high" class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-400">High</button>
          </div>
        </div>
        <button id="render-btn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1.5">
          ▶ Render
        </button>
      </div>
      <div id="editor-wrapper">
        <div id="monaco-container"></div>
        <div id="section-view" class="absolute inset-0 bg-slate-950 p-4 overflow-y-auto hidden z-10"></div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div id="preview-panel" class="flex-col flex-1 overflow-hidden hidden">
      <div class="bg-slate-950 px-3 py-2 border-b border-slate-800 flex items-center justify-between shrink-0">
        <span class="text-sm text-slate-300">🎬 Output</span>
        <span id="render-time" class="text-xs text-slate-500"></span>
      </div>
      <div class="flex-1 flex items-center justify-center bg-slate-950 p-4 relative" id="preview-area">
        <div id="placeholder" class="text-center">
          <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-3xl">🎞️</div>
          <p class="text-slate-400 text-sm">Ready to render</p>
          <p class="text-slate-600 text-xs mt-1">Tap Render to start</p>
        </div>
        <video id="video" class="w-full h-full object-contain hidden rounded-xl" controls playsinline></video>
        <img id="image" class="w-full h-full object-contain hidden rounded-xl">
      </div>
      <div id="action-bar" class="px-4 py-3 border-t border-slate-800 flex justify-between items-center hidden shrink-0">
        <span class="text-sm text-emerald-400 font-medium">✓ Success</span>
        <a id="download-btn" href="#" download class="bg-indigo-600 active:bg-indigo-500 px-4 py-2 rounded-xl text-sm font-semibold">⬇ Download</a>
      </div>
      <div id="error-box" class="m-3 bg-red-950/50 border border-red-500/30 rounded-xl p-3 text-sm text-red-300 hidden">
        <div class="font-bold mb-1">Error</div>
        <pre id="error-text" class="whitespace-pre-wrap text-xs"></pre>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-2xl text-sm flex items-center gap-2 opacity-0 translate-y-8 transition-all z-50 shadow-xl">
    <span id="toast-icon">✓</span>
    <span id="toast-msg"></span>
  </div>

<script>
  // ==================== CONFIG ====================
  // Production (Render.com Live Backend):
  const BACKEND_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost'
    ? "http://127.0.0.1:8000"
    : "https://renderora.onrender.com";

  const GOOGLE_CLIENT_ID = "729764162601-988q3pc6rbhd6nmoa563j8opqgiiatvd.apps.googleusercontent.com";

  let editor = null;
  let isLoggedIn = false;
  let isPro = false;
  let rendersToday = parseInt(localStorage.getItem('rendersToday') || '0');
  let quality = 'LOW';
  let history = JSON.parse(localStorage.getItem('renderora_history') || '[]');
  let currentUser = null;

  const defaultCode = `from manim import *

class CreateCircle(Scene):
    def construct(self):
        circle = Circle()
        circle.set_fill(PINK, opacity=0.5)
        self.play(Create(circle))
        self.wait()`;

  function toast(msg, icon = "✓") {
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    document.getElementById('toast-icon').textContent = icon;
    t.classList.remove('opacity-0', 'translate-y-8');
    setTimeout(() => t.classList.add('opacity-0', 'translate-y-8'), 2200);
  }

  function updateQuota() {
    const limit = isPro ? 20 : 5;
    document.getElementById('quota-text').textContent = `${rendersToday} / ${limit}`;
    document.getElementById('quota-bar').style.width = `${Math.min(100, (rendersToday / limit) * 100)}%`;
    localStorage.setItem('rendersToday', rendersToday);
  }

  // Drawer
  document.getElementById('menu-btn').onclick = () => {
    document.getElementById('drawer').classList.remove('-translate-x-full');
    document.getElementById('drawer-bg').classList.remove('hidden');
  };
  document.getElementById('close-drawer').onclick = closeDrawer;
  document.getElementById('drawer-bg').onclick = closeDrawer;
  function closeDrawer() {
    document.getElementById('drawer').classList.add('-translate-x-full');
    document.getElementById('drawer-bg').classList.add('hidden');
  }

  // Sections
  function showSection(name) {
    closeDrawer();
    const monacoEl = document.getElementById('monaco-container');
    const view = document.getElementById('section-view');

    if (name === 'editor') {
      monacoEl.style.display = 'block';
      view.classList.add('hidden');
      showEditor();
      if (editor) setTimeout(() => editor.layout(), 100);
      return;
    }

    monacoEl.style.display = 'none';
    view.classList.remove('hidden');
    showEditor();

    if (name === 'history') {
      let html = `<h2 class="text-lg font-bold text-indigo-400 mb-4">🕒 History</h2>`;
      if (!history.length) html += `<p class="text-slate-500 text-sm">No saved scenes yet.</p>`;
      else history.slice().reverse().forEach((item, i) => {
        html += `<div class="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-2 flex justify-between items-center">
          <div><div class="text-sm font-medium">${item.title}</div>
          <div class="text-xs text-slate-500">${new Date(item.time).toLocaleString()}</div></div>
          <button onclick="loadHistory(${history.length - 1 - i})" class="text-xs bg-indigo-600 px-3 py-1.5 rounded-lg">Load</button>
        </div>`;
      });
      view.innerHTML = html;
    }

    if (name === 'library') {
      view.innerHTML = `<h2 class="text-lg font-bold text-indigo-400 mb-4">📚 Library</h2>
        <div class="space-y-2">${Object.keys(templates).map(k => `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
            <span class="text-sm font-medium capitalize">${k}</span>
            <button onclick="loadTemplate('${k}')" class="text-xs bg-indigo-600 px-3 py-1.5 rounded-lg">Load</button>
          </div>`).join('')}
        </div>`;
    }
  }

  function loadHistory(i) {
    if (editor && history[i]) {
      editor.setValue(history[i].code);
      showSection('editor');
      toast("Loaded");
    }
  }

  function openPricing() { document.getElementById('pricing-modal').classList.remove('hidden'); closeDrawer(); }
  function closePricing() { document.getElementById('pricing-modal').classList.add('hidden'); }
  function upgradePro() { isPro = true; closePricing(); updateQuota(); toast("Pro activated", "⭐"); }

  // Tabs
  function showEditor() {
    document.getElementById('editor-panel').classList.remove('hidden');
    document.getElementById('preview-panel').classList.add('hidden');
    document.getElementById('tab-editor').classList.add('text-indigo-400', 'border-indigo-500');
    document.getElementById('tab-editor').classList.remove('text-slate-400', 'border-transparent');
    document.getElementById('tab-preview').classList.add('text-slate-400', 'border-transparent');
    document.getElementById('tab-preview').classList.remove('text-indigo-400', 'border-indigo-500');
    if (editor) setTimeout(() => editor.layout(), 100);
  }
  function showPreview() {
    document.getElementById('editor-panel').classList.add('hidden');
    document.getElementById('preview-panel').classList.remove('hidden');
    document.getElementById('tab-preview').classList.add('text-indigo-400', 'border-indigo-500');
    document.getElementById('tab-preview').classList.remove('text-slate-400', 'border-transparent');
    document.getElementById('tab-editor').classList.add('text-slate-400', 'border-transparent');
    document.getElementById('tab-editor').classList.remove('text-indigo-400', 'border-indigo-500');
  }
  document.getElementById('tab-editor').onclick = showEditor;
  document.getElementById('tab-preview').onclick = showPreview;

  // Quality
  document.getElementById('q-low').onclick = () => {
    quality = 'LOW';
    document.getElementById('q-low').className = 'px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-600 text-white';
    document.getElementById('q-high').className = 'px-2.5 py-1 rounded-md text-xs font-medium text-slate-400';
  };
  document.getElementById('q-high').onclick = () => {
    if (!isPro) { openPricing(); return; }
    quality = 'HIGH';
    document.getElementById('q-high').className = 'px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-600 text-white';
    document.getElementById('q-low').className = 'px-2.5 py-1 rounded-md text-xs font-medium text-slate-400';
  };

  // Monaco
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('monaco-container'), {
      value: localStorage.getItem('manim_code') || defaultCode,
      language: 'python',
      theme: 'vs-dark',
      fontSize: 14,
      fontFamily: 'JetBrains Mono, monospace',
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
      padding: { top: 12 },
      lineNumbers: 'on',
      wordWrap: 'on'
    });
    setTimeout(() => editor.layout(), 100);
    setTimeout(() => editor.layout(), 400);
    setTimeout(() => editor.layout(), 800);

    editor.onDidChangeModelContent(() => {
      clearTimeout(window.saveT);
      window.saveT = setTimeout(() => {
        localStorage.setItem('manim_code', editor.getValue());
      }, 800);
    });

    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
      document.getElementById('render-btn').click();
    });
  });

  // Templates
  const templates = {
    circle: defaultCode,
    square: `from manim import *\n\nclass SquareToCircle(Scene):\n    def construct(self):\n        sq = Square().set_fill(BLUE, opacity=0.5)\n        circle = Circle().set_fill(PINK, opacity=0.5)\n        self.play(Create(sq))\n        self.play(Transform(sq, circle))\n        self.wait()`,
    math: `from manim import *\n\nclass FormulaScene(Scene):\n    def construct(self):\n        eq = MathTex(r"e^{i\\\\pi} + 1 = 0")\n        self.play(Write(eq))\n        self.wait()`,
    walking: `from manim import *\n\nclass WalkingHuman(Scene):\n    def construct(self):\n        head = Circle(radius=0.3, color=WHITE).shift(UP*1.5)\n        torso = Line(UP*1.2, DOWN*0.2, color=WHITE)\n        stickman = VGroup(head, torso).shift(LEFT*3)\n        self.play(Create(stickman))\n        self.play(stickman.animate.shift(RIGHT*6), run_time=3)\n        self.wait()`,
    matplotlib: `import matplotlib.pyplot as plt\nimport numpy as np\n\nx = np.linspace(0, 2*np.pi, 200)\nplt.figure(figsize=(8,4), facecolor='#0f172a')\nplt.plot(x, np.sin(x), color='#818cf8', lw=2)\nplt.title('Sine Wave', color='white')\nplt.grid(True, alpha=0.2)\nplt.tight_layout()`,
    heart: `import matplotlib.pyplot as plt\nimport numpy as np\nfrom matplotlib.animation import FuncAnimation\n\nfig, ax = plt.subplots(figsize=(7,7), facecolor='black')\nax.set_facecolor('black')\nax.set_xlim(-2,2)\nax.set_ylim(-2,2)\nax.axis('off')\nt = np.linspace(0, 2*np.pi, 250)\nhx = 16*np.sin(t)**3/16\nhy = (13*np.cos(t)-5*np.cos(2*t)-2*np.cos(3*t)-np.cos(4*t))/16\nn=600\ntheta=np.random.uniform(0,2*np.pi,n)\nr=np.random.uniform(0,1.15,n)**0.5\npx,py=r*np.cos(theta),r*np.sin(theta)\ntx=hx[np.random.randint(0,len(hx),n)]\nty=hy[np.random.randint(0,len(hy),n)]\nscat=ax.scatter(px,py,c=plt.cm.plasma(np.linspace(0.2,0.9,n)),s=5,alpha=0.9)\n\ndef update(f):\n    global px,py\n    px=px*0.93+tx*0.07\n    py=py*0.93+ty*0.07\n    beat=1+0.05*np.sin(f*0.18)\n    scat.set_offsets(np.c_[px*beat,py*beat])\n    return scat,\n\nani=FuncAnimation(fig,update,frames=100,interval=30,blit=True)\nplt.close()`
  };

  function loadTemplate(key) {
    if (editor && templates[key]) {
      editor.setValue(templates[key]);
      showSection('editor');
      toast("Example loaded");
    }
  }
  document.getElementById('template-select').onchange = e => {
    if (e.target.value) loadTemplate(e.target.value);
  };

  // Render
  document.getElementById('render-btn').onclick = async () => {
    const limit = isPro ? 20 : 5;
    if (rendersToday >= limit) { openPricing(); toast("Limit reached", "⚠️"); return; }
    if (!isLoggedIn && rendersToday >= 3) { toast("Sign in for more free renders", "⚠️"); return; }

    if (!editor) { toast("Editor not ready", "⚠️"); return; }

    const code = editor.getValue();
    const isPlot = code.includes("plt.") && !code.includes("FuncAnimation");
    const endpoint = isPlot ? '/render-plot' : '/render';

    showPreview();
    const start = Date.now();

    document.getElementById('error-box').classList.add('hidden');
    document.getElementById('video').classList.add('hidden');
    document.getElementById('image').classList.add('hidden');
    document.getElementById('action-bar').classList.add('hidden');
    document.getElementById('placeholder').classList.remove('hidden');
    document.getElementById('placeholder').innerHTML = `
      <div class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-[3px] border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-indigo-400 text-sm">Rendering (${quality})...</p>
      </div>`;

    try {
      const res = await fetch(`${BACKEND_URL}${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, quality })
      });

      const data = await res.json();
      const time = ((Date.now() - start) / 1000).toFixed(1);

      if (!res.ok) throw new Error(data.detail || "Render failed");

      rendersToday++;
      updateQuota();
      document.getElementById('render-time').textContent = `${time}s`;
      document.getElementById('placeholder').classList.add('hidden');

      if (data.video_url) {
        let url = data.video_url;
        if (!url.startsWith('http')) url = BACKEND_URL + url;

        const v = document.getElementById('video');
        v.src = url;
        v.classList.remove('hidden');
        v.load();
        v.play().catch(() => {});
        document.getElementById('download-btn').href = url;
      } else if (data.image_url) {
        let url = data.image_url;
        if (!url.startsWith('http')) url = BACKEND_URL + url;

        const img = document.getElementById('image');
        img.src = url;
        img.classList.remove('hidden');
        document.getElementById('download-btn').href = url;
      } else {
        throw new Error("No video/image URL returned from server");
      }

      document.getElementById('action-bar').classList.remove('hidden');
      toast("Render complete");
    } catch (err) {
      document.getElementById('placeholder').classList.add('hidden');
      document.getElementById('error-box').classList.remove('hidden');
      document.getElementById('error-text').textContent = err.message;
      toast("Render failed", "❌");
    }
  };

  // Auth
  function decodeJwt(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }

  function handleCredentialResponse(response) {
    const profile = decodeJwt(response.credential);
    currentUser = profile;
    isLoggedIn = true;

    document.getElementById('auth-area').innerHTML = `
      <img src="${profile.picture}" class="w-8 h-8 rounded-full border-2 border-indigo-500 object-cover cursor-pointer"
           onclick="document.getElementById('menu-btn').click()">`;

    document.getElementById('user-info').classList.remove('hidden');
    document.getElementById('user-pic').src = profile.picture;
    document.getElementById('user-name').textContent = profile.name;
    document.getElementById('user-email').textContent = profile.email;

    localStorage.setItem('renderora_user', JSON.stringify(profile));
    toast(`Welcome, ${profile.given_name}!`, "👋");
  }

  function signOut() {
    isLoggedIn = false;
    currentUser = null;
    localStorage.removeItem('renderora_user');
    document.getElementById('auth-area').innerHTML = `
      <button id="login-btn" class="bg-white text-gray-900 text-xs font-semibold px-3 py-1.5 rounded-lg">Sign in</button>`;
    document.getElementById('user-info').classList.add('hidden');
    const btn = document.getElementById('login-btn');
    if (btn) btn.onclick = () => google.accounts.id.prompt();
    toast("Signed out");
    closeDrawer();
  }
  document.getElementById('signout-btn').onclick = signOut;

  window.onload = () => {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
      auto_select: false
    });

    const saved = localStorage.getItem('renderora_user');
    if (saved) {
      try {
        const profile = JSON.parse(saved);
        currentUser = profile;
        isLoggedIn = true;
        document.getElementById('auth-area').innerHTML = `
          <img src="${profile.picture}" class="w-8 h-8 rounded-full border-2 border-indigo-500 object-cover cursor-pointer"
               onclick="document.getElementById('menu-btn').click()">`;
        document.getElementById('user-info').classList.remove('hidden');
        document.getElementById('user-pic').src = profile.picture;
        document.getElementById('user-name').textContent = profile.name;
        document.getElementById('user-email').textContent = profile.email;
      } catch {}
    }

    const btn = document.getElementById('login-btn');
    if (btn) btn.onclick = () => google.accounts.id.prompt();
  };

  updateQuota();
</script>
</body>
</html>
